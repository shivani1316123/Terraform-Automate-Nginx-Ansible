---
platform_name: "Northwind Portals"
web_root: /var/www

# One entry = one website.
#   slug -> URL path  (http://<ALB>/<slug>/)
#   port -> private port the site's own Nginx server block listens on (127.0.0.1 only)
sites:
  - slug: employee
    port: 8001
    title: Employee Portal
    icon: "👥"
    headline: "Everything you need at work, in one place."
    tagline: "Mark attendance, download payslips, apply for leave and find any colleague in seconds."
    accent: "#3730a3"
    tint: "#f3f4fc"
    bright: "#818cf8"
    stats:
      - { value: "1,200+", label: "Employees onboarded" }
      - { value: "99.9%",  label: "Uptime last quarter" }
      - { value: "2 min",  label: "Average leave approval" }
    features:
      - { icon: "🕒", title: "Attendance",     text: "Check in and out and see your working hours calculated for you." }
      - { icon: "💸", title: "Payslips",       text: "Download any month's payslip and tax statement as a PDF." }
      - { icon: "📇", title: "Team directory", text: "Find people, teams and reporting lines with a single search." }

  - slug: customer
    port: 8002
    title: Customer Portal
    icon: "🤝"
    headline: "Your orders and account, always within reach."
    tagline: "Follow deliveries, update your details and get answers without waiting on hold."
    accent: "#0e7490"
    tint: "#f0fbfd"
    bright: "#22d3ee"
    stats:
      - { value: "50K+", label: "Active customers" }
      - { value: "4.9 / 5", label: "Average rating" }
      - { value: "< 2 s", label: "Page response time" }
    features:
      - { icon: "📦", title: "Order tracking", text: "See where every parcel is, from packing to your doorstep." }
      - { icon: "🧾", title: "Invoices",       text: "Every invoice and receipt, searchable and ready to download." }
      - { icon: "💬", title: "Live chat",      text: "Talk to a person who can see your account history." }

  - slug: insurance
    port: 8003
    title: Insurance Portal
    icon: "🛡️"
    headline: "Cover that is clear before you need it."
    tagline: "Compare plans, renew policies and file a claim online with every step visible."
    accent: "#047857"
    tint: "#f1fbf6"
    bright: "#34d399"
    stats:
      - { value: "15",    label: "Plans to choose from" }
      - { value: "3 min", label: "To file a claim" }
      - { value: "98%",   label: "Claims settled" }
    features:
      - { icon: "🧮", title: "Instant quotes", text: "Enter a few details and see premiums for every plan." }
      - { icon: "📝", title: "Simple claims",  text: "Upload documents, track status and get updates by SMS." }
      - { icon: "🔐", title: "Policy vault",   text: "Keep all your policy documents safe in one place." }

  - slug: reports
    port: 8004
    title: Reports Portal
    icon: "📊"
    headline: "The numbers, without the wait."
    tagline: "Live dashboards and scheduled reports so every team can act on current data."
    accent: "#b45309"
    tint: "#fdf8ee"
    bright: "#fbbf24"
    stats:
      - { value: "200+",  label: "Ready-made reports" }
      - { value: "Live",  label: "Data refresh" }
      - { value: "5",     label: "Export formats" }
    features:
      - { icon: "📈", title: "Live dashboards",   text: "Sales, operations and finance metrics that update as they change." }
      - { icon: "⏰", title: "Scheduled reports", text: "Have the weekly summary land in your inbox every Monday." }
      - { icon: "📤", title: "One-click export",  text: "Send any report to PDF, Excel or CSV." }

  - slug: support
    port: 8005
    title: Support Portal
    icon: "🎧"
    headline: "Get help, and always know where it stands."
    tagline: "Raise a ticket, follow its progress and find answers before you even ask."
    accent: "#be185d"
    tint: "#fdf2f7"
    bright: "#f472b6"
    stats:
      - { value: "24 x 7", label: "Support coverage" }
      - { value: "15 min", label: "Average first response" }
      - { value: "96%",    label: "Customer satisfaction" }
    features:
      - { icon: "🎫", title: "Ticketing",      text: "Describe the problem once and follow it to resolution." }
      - { icon: "⏱️", title: "SLA tracking",   text: "See how much response time is left on every open ticket." }
      - { icon: "📚", title: "Knowledge base", text: "Step-by-step guides written by the people who fix things." }
