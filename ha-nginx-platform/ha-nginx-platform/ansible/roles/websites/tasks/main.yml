---
- name: Create document roots for the 5 sites and the landing page
  ansible.builtin.file:
    path: "{{ web_root }}/{{ item }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  loop: "{{ (sites | map(attribute='slug') | list) + ['hub'] }}"

- name: Copy the shared stylesheet into every site
  ansible.builtin.copy:
    src: style.css
    dest: "{{ web_root }}/{{ item }}/style.css"
    owner: www-data
    group: www-data
    mode: "0644"
  loop: "{{ (sites | map(attribute='slug') | list) + ['hub'] }}"

- name: Render each website's index.html from one template
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ web_root }}/{{ item.slug }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"
  loop: "{{ sites }}"
  loop_control:
    label: "{{ item.slug }}"

- name: Render the landing page
  ansible.builtin.template:
    src: hub.html.j2
    dest: "{{ web_root }}/hub/index.html"
    owner: www-data
    group: www-data
    mode: "0644"
