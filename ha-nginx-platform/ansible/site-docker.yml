---
# Docker variant: same reverse-proxy config, but each website runs in its own
# container on 127.0.0.1:800x instead of being served as static files by Nginx.
- name: Configure Nginx reverse proxy and run the 5 websites as Docker containers
  hosts: nginx_servers
  become: true
  gather_facts: true
  serial: 1

  roles:
    - nginx    # unchanged: public reverse proxy on port 80
    - docker   # installs Docker, builds and runs the 5 site containers

  post_tasks:
    - name: Health endpoint answers (used by the ALB)
      ansible.builtin.uri:
        url: http://127.0.0.1/health
        status_code: 200

    - name: Every website answers through the reverse proxy
      ansible.builtin.uri:
        url: "http://127.0.0.1/{{ item.slug }}/"
        status_code: 200
      loop: "{{ sites }}"
      loop_control:
        label: "/{{ item.slug }}/"
