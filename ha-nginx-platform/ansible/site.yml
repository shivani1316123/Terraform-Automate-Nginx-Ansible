---
- name: Configure Nginx reverse proxy and deploy the 5 websites
  hosts: webservers
  become: yes
  roles:
    - nginx
    - websites

  post_tasks:
    - name: Verify /health endpoint responds 200
      uri:
        url: "http://localhost/health"
        status_code: 200
      register: health_check

    - name: Verify each site path responds 200
      uri:
        url: "http://localhost/{{ item.slug }}/"
        status_code: 200
      loop: "{{ sites }}"
