---
- name: Deploy metrics exporters on the Nginx web servers
  hosts: webservers
  become: yes
  roles:
    - node_exporter
    - nginx_exporter

- name: Deploy Prometheus + Grafana on the monitoring server
  hosts: monitoring
  become: yes
  roles:
    - node_exporter
    - prometheus
    - grafana

  post_tasks:
    - name: Verify Prometheus is up
      uri:
        url: "http://localhost:9090/-/healthy"
        status_code: 200

    - name: Verify Grafana is up
      uri:
        url: "http://localhost:3000/api/health"
        status_code: 200
