---
- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-pip
    state: present
    update_cache: true

- name: Add Docker's official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: false

- name: Add the Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    state: present
    filename: docker

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Install the Python Docker SDK (needed by the docker_container module)
  ansible.builtin.pip:
    name: docker
    break_system_packages: true

- name: Add the SSH user to the docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Create a build context directory per website
  ansible.builtin.file:
    path: "/opt/docker-sites/{{ item.slug }}"
    state: directory
    mode: "0755"
  loop: "{{ sites }}"
  loop_control:
    label: "{{ item.slug }}"

- name: Render each site's index.html into its build context
  ansible.builtin.template:
    src: ../../websites/templates/index.html.j2
    dest: "/opt/docker-sites/{{ item.slug }}/index.html"
    mode: "0644"
  loop: "{{ sites }}"
  loop_control:
    label: "{{ item.slug }}"

- name: Copy the shared stylesheet into every build context
  ansible.builtin.copy:
    src: ../../websites/files/style.css
    dest: "/opt/docker-sites/{{ item.slug }}/style.css"
    mode: "0644"
  loop: "{{ sites }}"
  loop_control:
    label: "{{ item.slug }}"

- name: Write each site's Dockerfile
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "/opt/docker-sites/{{ item.slug }}/Dockerfile"
    mode: "0644"
  loop: "{{ sites }}"
  loop_control:
    label: "{{ item.slug }}"

- name: Build each website's Docker image
  community.docker.docker_image:
    name: "ha-nginx/{{ item.slug }}"
    tag: latest
    source: build
    build:
      path: "/opt/docker-sites/{{ item.slug }}"
    force_source: true
  loop: "{{ sites }}"
  loop_control:
    label: "{{ item.slug }}"

- name: Run each website as a container, bound to 127.0.0.1 only
  community.docker.docker_container:
    name: "web-{{ item.slug }}"
    image: "ha-nginx/{{ item.slug }}:latest"
    state: started
    recreate: true
    restart_policy: always
    ports:
      - "127.0.0.1:{{ item.port }}:80"
  loop: "{{ sites }}"
  loop_control:
    label: "{{ item.slug }}"
