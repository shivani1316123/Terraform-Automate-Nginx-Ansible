---
- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Deploy main Nginx site config
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/ha-nginx.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: Enable the ha-nginx site
  file:
    src: /etc/nginx/sites-available/ha-nginx.conf
    dest: /etc/nginx/sites-enabled/ha-nginx.conf
    state: link
  notify: reload nginx

- name: Remove default Nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Ensure Nginx is enabled and running
  systemd:
    name: nginx
    enabled: yes
    state: started
