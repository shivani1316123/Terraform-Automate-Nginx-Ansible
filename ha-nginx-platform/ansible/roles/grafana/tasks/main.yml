---
- name: Install prerequisite packages
  apt:
    name:
      - apt-transport-https
      - software-properties-common
      - gnupg2
      - curl
    state: present
    update_cache: yes

- name: Add Grafana GPG key
  get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /usr/share/keyrings/grafana.key
    mode: "0644"

- name: Dearmor Grafana GPG key
  shell: >
    gpg --dearmor < /usr/share/keyrings/grafana.key > /usr/share/keyrings/grafana-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/grafana-archive-keyring.gpg

- name: Add Grafana apt repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/grafana-archive-keyring.gpg] https://apt.grafana.com stable main"
    state: present
    filename: grafana

- name: Install Grafana
  apt:
    name: grafana
    state: present
    update_cache: yes

- name: Ensure provisioning directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"
  loop:
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards
    - /var/lib/grafana/dashboards

- name: Provision Prometheus as default datasource
  template:
    src: datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: grafana
    group: grafana
    mode: "0644"
  notify: restart grafana

- name: Provision dashboard loader config
  template:
    src: dashboard-provider.yml.j2
    dest: /etc/grafana/provisioning/dashboards/provider.yml
    owner: grafana
    group: grafana
    mode: "0644"
  notify: restart grafana

- name: Deploy the HA Nginx Platform overview dashboard JSON
  copy:
    src: ha-nginx-overview-dashboard.json
    dest: /var/lib/grafana/dashboards/ha-nginx-overview.json
    owner: grafana
    group: grafana
    mode: "0644"
  notify: restart grafana

- name: Enable and start Grafana
  systemd:
    name: grafana-server
    enabled: yes
    state: started
