---
- name: Create nginx_exporter system user
  user:
    name: nginx_exporter
    system: yes
    shell: /usr/sbin/nologin
    create_home: no

- name: Download nginx-prometheus-exporter
  get_url:
    url: "https://github.com/nginxinc/nginx-prometheus-exporter/releases/download/v{{ nginx_exporter_version }}/nginx-prometheus-exporter_{{ nginx_exporter_version }}_linux_amd64.tar.gz"
    dest: /tmp/nginx_exporter.tar.gz
    mode: "0644"

- name: Extract nginx-prometheus-exporter
  unarchive:
    src: /tmp/nginx_exporter.tar.gz
    dest: /tmp/
    remote_src: yes

- name: Install nginx-prometheus-exporter binary
  copy:
    src: /tmp/nginx-prometheus-exporter
    dest: /usr/local/bin/nginx-prometheus-exporter
    owner: nginx_exporter
    group: nginx_exporter
    mode: "0755"
    remote_src: yes

- name: Deploy nginx_exporter systemd unit
  template:
    src: nginx_exporter.service.j2
    dest: /etc/systemd/system/nginx_exporter.service
    mode: "0644"
  notify: restart nginx_exporter

- name: Enable and start nginx_exporter
  systemd:
    name: nginx_exporter
    enabled: yes
    state: started
    daemon_reload: yes
